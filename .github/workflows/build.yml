name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -miphoneos-version-min=14.0 -framework UIKit -framework Foundation -install_name @rpath/Credit.dylib Credit.m -o Credit.dylib
          codesign -f -s - Credit.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: Credit-dylib
          path: Credit.dylib
